name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Install Skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: Copy images to Aliyun
      shell: bash
      env:
        ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
        ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
        ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
        ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
      run: |
        auth_dir=$(mktemp -d)
        auth_file="$auth_dir/auth.json"
        trap 'rm -f -- "$auth_file"; rmdir -- "$auth_dir"' EXIT
        printf '%s\n' "$ALIYUN_REGISTRY_PASSWORD" |
          skopeo login --authfile "$auth_file" --username "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            line=${line%$'\r'}
            [[ "$line" =~ ^[[:space:]]*$ ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            echo "image $image"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]:-}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            line=${line%$'\r'}
            [[ "$line" =~ ^[[:space:]]*$ ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
        
            platform_options=()
            platform_prefix=""
            if [[ "$line" =~ ^[[:space:]]*--platform[=[:space:]]+([^[:space:]]+)[[:space:]]+([^[:space:]]+)[[:space:]]*$ ]]; then
                platform=${BASH_REMATCH[1]}
                image=${BASH_REMATCH[2]}
                if [[ ! "$platform" =~ ^([a-z0-9]+)/([a-z0-9_]+)(/([a-z0-9]+))?$ ]]; then
                    printf 'Invalid platform: %s\n' "$platform" >&2
                    exit 1
                fi
                platform_options=(--override-os "${BASH_REMATCH[1]}" --override-arch "${BASH_REMATCH[2]}")
                if [[ -n "${BASH_REMATCH[4]:-}" ]]; then
                    platform_options+=(--override-variant "${BASH_REMATCH[4]}")
                fi
                platform_prefix="${platform//\//_}_"
            elif [[ "$line" =~ ^[[:space:]]*([[:alnum:]][^[:space:]]*)[[:space:]]*$ ]]; then
                image=${BASH_REMATCH[1]}
            else
                printf 'Invalid images.txt entry: %s\n' "$line" >&2
                exit 1
            fi
            image_without_digest=${image%%@*}

            # 获取 镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image_without_digest" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image_without_digest" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名例  例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            if [[ "$image_name_tag" != *:* ]]; then
                image_name_tag="$image_name_tag:latest"
            fi
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            printf 'Copy %s -> %s\n' "$image" "$new_image"
            skopeo "${platform_options[@]}" copy --authfile "$auth_file" --retry-times 3 \
              "docker://$image" "docker://$new_image"
            
            # Read the destination tag back from Aliyun before reporting success.
            if [[ -n "$platform_prefix" ]]; then
                actual_platform=$(skopeo inspect --authfile "$auth_file" --config "docker://$new_image" |
                  jq -er '.os + "/" + .architecture')
                expected_platform="${platform%/*}"
                if [[ "$platform" != */*/* ]]; then expected_platform="$platform"; fi
                if [[ "$actual_platform" != "$expected_platform" ]]; then
                    printf 'Destination platform mismatch: expected %s, got %s for %s\n' "$expected_platform" "$actual_platform" "$new_image" >&2
                    exit 1
                fi
                remote_digest=$(skopeo inspect --authfile "$auth_file" --format '{{.Digest}}' "docker://$new_image")
                printf 'Verified destination %s platform=%s digest=%s\n' "$new_image" "$actual_platform" "$remote_digest"
            fi

        done < images.txt

